name: Partner release checks

# pull_request plus push to main. A main run seeds actions/cache; pull requests
# restore that default-branch cache. Each job has its own runner.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: connect-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require Xcode 26.6
        id: xcode
        run: |
          bash .github/scripts/require-xcode-26.6.sh
          echo "build=$(xcodebuild -version | awk 'END { print $NF }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .bench/unit/DerivedData/SourcePackages
            .bench/unit/DerivedData/ModuleCache.noindex
            .bench/unit/DerivedData/Build
          # Exact key is the sources. The prefix restores the latest products for
          # this Xcode build and package resolution; either change is a miss.
          key: derived-unit-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            derived-unit-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-
      - name: Build and run the package unit tests
        run: bash .github/scripts/ci-unit-tests.sh
      - name: Upload unit-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-unit-tests-failure
          path: |
            .bench/unit/*.log
            .bench/unit/UnitTests.xcresult
          retention-days: 7

  examples:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require Xcode 26.6
        run: bash .github/scripts/require-xcode-26.6.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .bench/examples/DerivedData/SourcePackages
            .bench/examples/DerivedData/ModuleCache.noindex
          key: swiftpm-examples-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-26.6
          restore-keys: |
            swiftpm-examples-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-
            swiftpm-examples-
      - name: Compile the example apps for the simulator
        run: bash .github/scripts/ci-examples.sh
      - name: Upload example-build evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-examples-failure
          path: .bench/examples/*.log
          retention-days: 7

  checks:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require Xcode 26.6
        run: bash .github/scripts/require-xcode-26.6.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .bench/checks/DerivedData/SourcePackages
            .bench/checks/DerivedData/ModuleCache.noindex
          key: swiftpm-checks-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-26.6
          restore-keys: |
            swiftpm-checks-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}-xcode-
            swiftpm-checks-
      - name: Check partner docs, device libraries, and DocC
        env:
          PARTNER_DOCS_DENYLIST: ${{ secrets.PARTNER_DOCS_DENYLIST }}
        run: bash .github/scripts/ci-checks.sh
      - name: Upload check evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-checks-failure
          path: .bench/checks/*.log
          retention-days: 7
